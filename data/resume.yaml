summary: "Doctoral research in trajectory modeling and representation learning, with current projects in generative traffic simulation and adaptive sensing."

# Industry resume: a curated summary, separate from the academic CV below.
industry:
  headline: "Machine Learning Research & Software Engineering"
  research:
    title: "Doctoral Research | KAIST"
    bullets:
      - "Developed Transformer-based trajectory reconstruction and evaluated the contributions of different inputs to motion prediction."
      - "Developed road-network representations and label-alignment methods using language models and graph learning, supporting cross-city transfer and learning with limited labels."
  projects:
    - title: "Generative Traffic Simulation"
      status: "Ongoing research"
      url: /projects/route-conditioned-traffic-simulation/
      text: "Developing route-conditioned traffic generation with joint model fine-tuning for autonomous-driving simulation."
    - title: "Adaptive Sensing Web (ATSW)"
      status: "Research prototype"
      url: /projects/autonomous-traffic-sensor-web/
      text: "Built a Python/FastAPI and React/TypeScript system for GPS replay, adaptive reporting, and receiver-state estimation."
  skills:
    - label: Machine Learning
      text: "Deep Learning, Generative Modeling, Representation Learning."
    - label: Programming Languages
      text: "Python, C, JavaScript, TypeScript, MATLAB."
  publication_record: "Four first-author papers in Knowledge-Based Systems, Communications in Transportation Research, and IEEE ITSC (2025-2026)."

areas:
  - Spatiotemporal AI
  - Generative Modeling
  - Representation Learning

highlights:
  - title: "Trajectory reconstruction"
    text: "Developed ProChunkFormer for sparse GPS reconstruction. On Porto taxi data at 240-second sampling intervals, reduced runtime by 20.7% and road-network MAE by 25.1% versus an autoregressive Transformer."
    url: /publications/2025-liu-enhanced-trajectory-reconstruction/
  - title: "Motion prediction analysis"
    text: "Designed SDA to measure the contributions of historical motion, current state, and goal information. Evaluated LSTM and Transformer forecasting on Porto taxi and ETH pedestrian data."
    url: /publications/2025-liu-sda/
  - title: "Transferable representations"
    text: "Combined LLM-derived semantics with heterogeneous graph learning. Achieved 0.6766 F1 in Porto-to-Lisbon transfer without retraining, compared with 0.6968 F1 for a Lisbon-trained model."
    url: /publications/2025-liu-a-generalizable-semantic/
  - title: "Low-supervision learning"
    text: "Combined LLM pseudo-labels with structural embeddings for cross-taxonomy alignment. With 1% human-labeled data, achieved 51.3% accuracy versus 40.0% for direct supervised training."
    url: /publications/2025-liu-cross-taxonomy-label-alignment/

projects:
  - title: "Route-Conditioned Traffic Simulation"
    status: "Ongoing research"
    text: "Developing route-conditioned traffic generation and joint fine-tuning on SMART/CAT-K. Implemented recorded-scene adapters and offline intent-aware route allocation under feasibility and quota constraints; closed-loop evaluation is ongoing."
    url: /projects/route-conditioned-traffic-simulation/
    bullets:
      - "Developing route-conditioned traffic generation on SMART/CAT-K by jointly fine-tuning a route encoder, conditioning branch, and motion decoder."
      - "Implemented recorded-scene initialization and offline route allocation under feasibility and quota constraints; route-control evaluation and integration are ongoing."
  - title: "Autonomous Traffic Sensor Web (ATSW)"
    status: "Working research prototype"
    text: "Built a local GPS replay web workspace with heuristic adaptive reporting, Kalman receiver-state estimation, historical reconstruction, playback controls, decision logs, and JSON run export."
    url: /projects/autonomous-traffic-sensor-web/
    bullets:
      - "Implemented a source-receiver replay system with adaptive GPS reporting and Kalman estimation, supporting policy comparison using position error and report counts."
      - "Built a FastAPI backend and React/TypeScript interface for inspecting receiver trajectories, reporting decisions, and historical reconstruction."

skills:
  - label: Machine Learning
    text: "Deep Learning, Generative Modeling, Representation Learning."
  - label: Model Architectures
    text: "Transformers, Graph Neural Networks."
  - label: Programming Languages
    text: "Python, C, JavaScript, TypeScript, MATLAB."

