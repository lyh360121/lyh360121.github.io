<script>
  (() => {
    const checkbox = document.getElementById('nav-toggle');
    const label = document.querySelector('label[for="nav-toggle"]');
    const menu = document.getElementById('nav-menu');
    if (!checkbox || !label || !menu) return;
    const toggle = document.createElement('button');
    toggle.type = 'button';
    toggle.className = label.className;
    toggle.setAttribute('aria-controls', 'nav-menu');
    while (label.firstChild) toggle.appendChild(label.firstChild);
    label.replaceWith(toggle);
    const setOpen = (open) => {
      checkbox.checked = open;
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close navigation menu' : 'Open navigation menu');
      toggle.querySelector('#show-button')?.classList.toggle('hidden', open);
      toggle.querySelector('#hide-button')?.classList.toggle('hidden', !open);
    };
    setOpen(checkbox.checked);
    toggle.addEventListener('click', () => setOpen(!checkbox.checked));
    window.matchMedia('(min-width: 64rem)').addEventListener('change', () => setOpen(false));
    menu.addEventListener('click', (event) => {
      if (event.target.closest('a')) setOpen(false);
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && checkbox.checked) {
        setOpen(false);
        toggle.focus();
      }
    });
  })();
</script>
